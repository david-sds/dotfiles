<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Alacritty-only (bin/local/alacritty sets FONTCONFIG_FILE). -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Alacritty can't render COLRv1; hide it so the CBDT build in
       ~/.local/share/fonts wins (both share the "Noto Color Emoji" family). -->
  <selectfont>
    <rejectfont>
      <glob>*/Noto-COLRv1.ttf</glob>
    </rejectfont>
  </selectfont>
  <!-- Any nerd font: all are named "<Name> Nerd Font". -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <!-- Text-style dingbats (e.g. Claude's ✳ spinner) before the emoji
           font, otherwise they render as oversized color emoji. -->
      <string>OpenSymbol</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- OpenSymbol's dingbats are drawn small; scale them up a bit. -->
  <match target="font">
    <test name="family">
      <string>OpenSymbol</string>
    </test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix><double>1.3</double><double>0</double><double>0</double><double>1.3</double></matrix>
      </times>
    </edit>
  </match>
</fontconfig>

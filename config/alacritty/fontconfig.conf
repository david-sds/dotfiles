<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Only used by Alacritty (via the scripts/local/alacritty wrapper setting
    FONTCONFIG_FILE), never touches the system-wide font config.

    DejaVu Sans ships black-and-white outline glyphs for a handful of emoji
    codepoints (e.g. the U+1F600 smiley) and gets matched ahead of Noto
    Color Emoji during glyph-fallback lookups, so those specific emoji
    render outlined in the terminal while others (not in DejaVu Sans) fall
    back to full color. Strip the emoji-range codepoints from what DejaVu
    Sans claims to support so fallback naturally moves on to Noto Color
    Emoji for all of them.
  -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir prefix="xdg">fontconfig-alacritty</cachedir>
  <match target="scan">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x1F300</int><int>0x1FAFF</int></range>
          <range><int>0x2600</int><int>0x27BF</int></range>
          <range><int>0x1F1E6</int><int>0x1F1FF</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>

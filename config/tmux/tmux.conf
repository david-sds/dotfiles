# -----------------------------------------------------------------------------
# Global Configs
# -----------------------------------------------------------------------------

# Uses .bashrc configs and starts faster
set -g default-command "${SHELL}"

# Enable Colours
# set -g default-terminal "tmux-256color"
# set -as terminal-overrides ",xterm*:Tc:sitm=\E[3m"

# Windows numbering
set -g base-index 1
set -g pane-base-index 1

# Enable Mouse
set -g mouse on

# Scrollback
set -g history-limit 50000

# Neovim CheckHealth Recommendations
set-option -sg escape-time 10
set-option -g focus-events on

# -----------------------------------------------------------------------------
# Bindings
# -----------------------------------------------------------------------------

# Enables Home/End Keys
bind -n Home send Escape "OH"
bind -n End send Escape "OF"

# Prefix Key
set -g prefix C-a

# Allows nvim increment with double C-a
bind C-a send-prefix

# Unbind 'Suspend the current client'
unbind -T prefix C-z

# VIM motions
set-window-option -g mode-keys vi
bind -T copy-mode-vi "v" { send -X begin-selection; set -p cursor-colour red }
bind -T copy-mode-vi "V" { send -X select-line; set -p cursor-colour red }
bind -T copy-mode-vi Escape { send -X clear-selection; set -pu cursor-colour }
bind -T copy-mode-vi "y" send -X copy-selection

# Enable Mouse Dragging
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDrag1Pane { select-pane; send -X begin-selection; set -p cursor-colour red }

# Split Windows
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Previous Window
unbind -
bind - last-window

# Manage marked panes
bind J join-pane
bind S swap-pane

# Open floating pane
bind -n M-\` run-shell "~/.config/tmux/scripts/tmux-open-floating.sh \
  '#{session_name}' '#{window_index}' '#{pane_index}' '#{pane_current_path}'"
bind -n M-\' run-shell "~/.config/tmux/scripts/tmux-open-floating.sh \
  '#{session_name}' '#{window_index}' '#{pane_index}' '#{pane_current_path}'"

# LazyGit
bind G new-pane -c "#{pane_current_path}" \
  -x "80%" -y "80%" -X "10%" -Y "10%" \
  lazygit

# Reload Config
bind R source-file "~/.config/tmux/tmux.conf" \; display-message "Config reloaded!"

# Kill unattached sessions
bind K confirm-before -p "Kill all unattached sessions? (y/n)" \
"run-shell ~/.config/tmux/scripts/tmux-kill-unattached.sh"

# Kill server
bind Q confirm-before -p "Kill server? (y/n)" "kill-server"

# Resize Panes
set -g @zoom_resize_block_msg "Resize blocked on zoomed mode!"
set -g @resize_if_not_zoomed 'if -F "#{window_zoomed_flag}" "display-message \"#{@zoom_resize_block_msg}\""'
bind -r h run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -L 5'"
bind -r j run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -D 5'"
bind -r k run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -U 5'"
bind -r l run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -R 5'"

# Copy pane target (session:window.pane)
bind C-y run-shell -b \
  "bash ~/.config/tmux/scripts/tmux-copy.sh 'tmux #{session_name}:#{window_index}.#{pane_index}'" \; \
  display-message "Copied: tmux #{session_name}:#{window_index}.#{pane_index}"

# FZF tmux panes
fzf_tmux_title="FZF tmux panes"
bind C-f new-pane -c "#{pane_current_path}" \
  -x "80%" -y "80%" -X "10%" -Y "10%" -T "$fzf_tmux_title" \
 'bash ~/.config/tmux/scripts/tmux-find-pane.sh "$fzf_tmux_title"'

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# Message style
set -g message-style "fill=yellow,fg=black,bg=yellow,bold"
set -g message-format "#[fill=yellow] #{message}"
# Main colors
set -g status-style bg=black
# Copy mode colors
setw -g mode-style "fg=black bg=yellow bold"
set-hook -g pane-mode-changed 'if -F "#{selection_present}" "set -p cursor-colour red" "set -pu cursor-colour"'
# Panes borders
set -g pane-border-style "fg=green"
set -g pane-active-border-style "fg=green"
# Top border + Title
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
# Statusbar
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-left " #[fg=yellow]< #[fg=white]#S #[fg=yellow]> "
set -g status-right-length 100
set -g status-right "#[fg=green] #(whoami)@#H #[fg=white bold]TMUX #[fg=yellow]v#(tmux -V | cut -d' ' -f2) "
# Window status
setw -g window-status-current-style "nounderscore"
setw -g window-status-current-format "#[fg=green bold] #I #W #F "
set -g window-status-separator ""
setw -g window-status-bell-style "fg=black bg=yellow bold"
setw -g window-status-format "#{?window_bell_flag,#[fg=black] #I #W #F ,#[fg=yellow] #I #[fg=white]#W #[fg=yellow]#F }"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "christoomey/vim-tmux-navigator"

set -g @tmux_navigator_disable_when_zoomed "1"

# Navigator copy-mode bindings (plugin's are broken with disable_when_zoomed)
bind -T copy-mode-vi C-h if -F "#{window_zoomed_flag}" "" "select-pane -L"
bind -T copy-mode-vi C-j if -F "#{window_zoomed_flag}" "" "select-pane -D"
bind -T copy-mode-vi C-k if -F "#{window_zoomed_flag}" "" "select-pane -U"
bind -T copy-mode-vi C-l if -F "#{window_zoomed_flag}" "" "select-pane -R"

# TPM Init
run "~/.config/tmux/plugins/tpm/tpm"

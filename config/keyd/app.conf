# keyd-application-mapper config (X11, Sway, GNOME).
#
# Setup (global keyd config, keyd group, mapper unit) is documented in
# config/etc_keyd_example.
#
# On X11 the window class is normalized to lowercase. Firefox reports
# "Navigator"/"firefox", so it matches [firefox] below.

[krunner]
control.n = down
control.p = up

[firefox]
control.n = down
control.p = up

# -----------------------------------------------------------------------------
# Bindings
# -----------------------------------------------------------------------------

# Enables Home/End Keys
bind -n Home send Escape "OH"
bind -n End send Escape "OF"

# Prefix Key
set -g prefix C-a

# Unbind 'Suspend the current client'
unbind -T prefix C-z

# VIM motions
set-window-option -g mode-keys vi
bind -T copy-mode-vi "v" send -X begin-selection
bind -T copy-mode-vi "y" send -X copy-selection

# Enable Mouse Dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# Split Windows
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Previous Window
unbind -
bind - last-window

# Manage marked panes
bind J join-pane
bind S swap-pane

# Open floating pane
bind -n M-\` run-shell "~/.config/tmux/scripts/tmux-open-floating.sh \
  '#{session_name}' '#{window_index}' '#{pane_index}' '#{pane_current_path}'"
bind -n M-\' run-shell "~/.config/tmux/scripts/tmux-open-floating.sh \
  '#{session_name}' '#{window_index}' '#{pane_index}' '#{pane_current_path}'"

# LazyGit
bind G new-pane -c "#{pane_current_path}" \
  -x "80%" -y "80%" -X "10%" -Y "10%" \
  lazygit

# Reload Config
bind R source-file "~/.config/tmux/tmux.conf" \; display-message "Config reloaded!"

# Kill unattached sessions
bind K confirm-before -p "Kill all unattached sessions? (y/n)" \
"run-shell ~/.config/tmux/scripts/tmux-kill-unattached.sh"

# Kill server
bind Q confirm-before -p "Kill server? (y/n)" "kill-server"

# Resize Panes
set -g @zoom_resize_block_msg "Resize blocked on zoomed mode!"
set -g @resize_if_not_zoomed 'if -F "#{window_zoomed_flag}" "display-message \"#{@zoom_resize_block_msg}\""'
bind -r h run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -L 5'"
bind -r j run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -D 5'"
bind -r k run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -U 5'"
bind -r l run-shell "tmux #{@resize_if_not_zoomed} 'resize-pane -R 5'"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "christoomey/vim-tmux-navigator"

set -g @tmux_navigator_disable_when_zoomed "1"

# TPM Init
run "~/.config/tmux/plugins/tpm/tpm"

# -----------------------------------------------------------------------------
# Omarchy
# -----------------------------------------------------------------------------

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# Message style
set -g message-style "fill=yellow,fg=black,bg=yellow,bold"
set -g message-format "#[fill=yellow] #{message}"
# Main colors
set -g status-style bg=black
# Copy mode colors
setw -g mode-style "fg=black bg=yellow bold"
# Panes borders
set -g pane-border-style "fg=green"
set -g pane-active-border-style "fg=green"
# Statusbar
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-left " #[fg=yellow]< #[fg=white]#S #[fg=yellow]> "
set -g status-right-length 100
set -g status-right "#[fg=green] #(whoami)@#H #[fg=white bold]TMUX #[fg=yellow]v#(tmux -V | cut -d' ' -f2) "
# Window status
setw -g window-status-current-style "nounderscore"
setw -g window-status-current-format "#[fg=green bold] #I #W #F "
setw -g window-status-format "#[fg=yellow] #I #[fg=white]#W #[fg=yellow]#F "
set -g window-status-separator ""
setw -g window-status-bell-style "fg=black bg=yellow bold"
